# Publishes the release when the staging → live PR is merged (Road to 0.2.x,
# versioning flow) — the second automatic PR. Runs on the push the merge makes
# to `live` (a push runs the workflow file from the pushed commit, so the very
# first merge, which brings this file into live, already works).
#
#   1. resolve  the merged PR and the newest rc that has not shipped (from the
#               tags) — that rc's bytes become the release
#   2. prepare / publish / finalize   the shared promote workflows
#               (TurboPanel/dev). prepare still waits on the `release`
#               environment approval: keep it until this path has run once end
#               to end, then drop it (`approval-environment: ""`).
#   3. start-version-pr   once v<version> exists, the next version from the
#               tags is its next patch: the Release App opens the PR
#               "chore: start <next>" (TurboPanel/dev's Start Version PR) that
#               moves package.json and the other committed version numbers on.
#               It merges itself once its checks pass (auto-merge); until
#               then canaries are refused (scripts/set-version.mjs --check). Minors and majors are
#               started with turbopaneld's Start Next Version, which opens the
#               same PR.
#
# A push to live that is not a merged staging PR (a break-glass promotion, the
# finalize fast-forward) does nothing. workflow_dispatch re-runs the release
# for a given rc tag.

name: Publish Release

on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      rc-tag:
        description: The rc tag to release (vX.Y.Z-rc.N)
        required: true
        type: string

# Read-only by default; the jobs that publish raise their own.
permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # commits/<sha>/pulls: the merged staging → live PR.
      pull-requests: read
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      rc-tag: ${{ steps.r.outputs.rc-tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # The newest rc above the newest release — what staging holds.
      - name: Work out the rc to release from the tags
        id: rc
        uses: TurboPanel/dev/.github/actions/version@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
        with:
          mode: release-rc

      - name: Find the merged PR and the rc it releases
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          INPUT_RC_TAG: ${{ inputs.rc-tag }}
          NEWEST_RC: ${{ steps.rc.outputs.rc-tag }}
          NEWEST_VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            rc_tag="$INPUT_RC_TAG"
            version="${rc_tag#v}"; version="${version%-rc.*}"
          else
            pr=""
            for _ in 1 2 3 4 5 6; do
              pr="$(gh api "repos/$REPO/commits/$PUSHED/pulls" --jq '[.[] | select(.base.ref == "live" and .head.ref == "staging" and .merged_at != null)][0].number // empty')"
              [ -n "$pr" ] && break
              sleep 10
            done
            if [ -z "$pr" ]; then
              echo "push to live is not a merged staging PR — nothing to release"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rc_tag="$NEWEST_RC"
            version="$NEWEST_VERSION"
            [ -n "$rc_tag" ] || { echo "::error::no rc newer than the latest release exists — publish an rc first (merge the trunk → staging PR)"; exit 1; }
            echo "PR #$pr merged; releasing $version from $rc_tag"
          fi
          if gh api "repos/$REPO/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version already exists — nothing to release"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "proceed=true"
            echo "rc-tag=$rc_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  prepare:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    # gh-promote.yml asks for contents: write (the release tag).
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      repo-kind: ui
      to: release
      source: ${{ needs.resolve.outputs.rc-tag }}
      dev-ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
      # Same signer pin as promote.yml.
      signer-ref: 93c4f94510c9499e6bf04366a9500fe9f8e38aaa
      # Default: the `release` environment approval stays for the release hop.
    # The environment signing secret only reaches the called workflow when the caller passes secrets down.
    secrets: inherit

  publish:
    needs: prepare
    # gh-release.yml creates the release and uploads its assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: release
      release-notes: ${{ needs.prepare.outputs.release-notes }}
      assets-artifact-name: ${{ needs.prepare.outputs.assets-artifact-name }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
      target-commit: ${{ needs.prepare.outputs.commit }}
    # The environment signing secret only reaches the called workflow when the caller passes secrets down.
    secrets: inherit

  finalize:
    needs: [prepare, publish]
    # gh-promote-finalize.yml moves `live` (GITHUB_TOKEN when the App cannot).
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote-finalize.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      to: release
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      branch: ${{ needs.prepare.outputs.branch }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
    # The environment signing secret only reaches the called workflow when the caller passes secrets down.
    secrets: inherit

  start-version-pr:
    # Right after the release: open the "chore: start <next patch>" PR that
    # moves the committed version numbers on. It merges itself once its checks
    # pass; until then canaries are refused. The PR and its commit are made with the Release App
    # token (GitHub signs the commit), never the GITHUB_TOKEN. This job's two
    # dev actions are pinned on their own, apart from the promote chain above.
    needs: [prepare, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: read # the tags
    steps:
      - name: Mint a Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      # v<released> exists now, so the base is its next patch.
      - name: Work out the next version from the tags
        id: next
        uses: TurboPanel/dev/.github/actions/version@c4ae5d95b3784421efcd136928bc706ffa239b6e # dev#68
        with:
          mode: base

      - name: Require the tags to show the release just made
        env:
          RELEASED: ${{ needs.prepare.outputs.version }}
          NEWEST: ${{ steps.next.outputs.release }}
          NEXT: ${{ steps.next.outputs.base }}
        run: |
          set -eu
          if [ "$NEWEST" != "$RELEASED" ]; then
            echo "::error::the tags say the newest release is '$NEWEST', not v$RELEASED that was just released; open the chore: start PR by hand (node scripts/set-version.mjs <next> in a PR)"
            exit 1
          fi
          case "$NEXT" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::could not work out the next version from the tags (got '$NEXT')"; exit 1 ;;
          esac
          echo "v$RELEASED released; the next version is $NEXT"

      - name: Open the start PR for the next version
        id: pr
        uses: TurboPanel/dev/.github/actions/start-version-pr@c4ae5d95b3784421efcd136928bc706ffa239b6e # dev#68
        with:
          version: ${{ steps.next.outputs.base }}
          github-token: ${{ steps.app.outputs.token }}
          reason: It was opened after v${{ needs.prepare.outputs.version }} was released.
          # Merges itself once its checks pass; canaries wait until then.
          auto-merge: "true"

      - name: Report the start PR
        env:
          PR_URL: ${{ steps.pr.outputs.pr-url }}
        run: |
          echo "start PR: ${PR_URL:-none (already at the next version)}"
