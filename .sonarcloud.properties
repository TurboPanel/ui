# SonarCloud Automatic Analysis config (CI uses sonar-project.properties instead).
# While Automatic Analysis is enabled, sonar-project.properties is ignored.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  .expo/**,\
  coverage/**

sonar.coverage.exclusions=\
  node_modules/**,\
  dist/**,\
  **/*.test.ts

# Deno.test() is not recognized by Sonar analysis; S2187 is a false positive.
sonar.issue.ignore.multicriteria=denoS2187
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
