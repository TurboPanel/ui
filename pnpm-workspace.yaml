allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
  - vite@6.4.4
overrides:
  sharp: ^0.35.5
  nanoid: ^3.3.18
  postcss: ^8.5.23
  uuid: ^11.1.1
  shell-quote: ^1.11.0
  js-yaml: ^4.3.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.9
  decode-uri-component: ^0.5.1
  esbuild: ^0.28.1
  fast-uri: ^3.1.9
  '@xmldom/xmldom@0.8': ^0.8.15
  '@xmldom/xmldom@0.9': ^0.9.12
  # GHSA-3wwx-pv8p-q78v: miniflare pins undici 7.29.0 exactly; force the fixed release.
  undici: 7.30.1
  # GHSA-68fv-2mgg-jv7q: source-map-js < 1.2.2 (event-loop DoS); pulled in by postcss and metro.
  source-map-js: 1.2.2
  # GHSA-vc2v-76pw-4v95: compression 1.8.1; @expo/cli pins it exactly.
  compression: 1.8.2
  # GHSA-587h-7wmj-h5pm and two related advisories: vite <= 6.4.3 bundles a vulnerable dev-server editor opener (Windows only); force the fixed release.
  vite: 6.4.4
  # GHSA-5x38-2vff-x55p and four more HIGH advisories: node-forge <= 1.4.0 (pulled in by the Expo command-line and code-signing tooling, build machines only); 1.4.2 also restores Buffer input to pem.decode that 1.4.1 broke.
  node-forge: 1.4.2
