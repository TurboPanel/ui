# Vestigial Automatic Analysis config. CI uses sonar-project.properties instead.
# Keep Automatic Analysis off for turbopanel_ui so verify.yml can scan with
# SONAR_TOKEN + Vitest LCOV. While Automatic Analysis is enabled,
# sonar-project.properties is ignored and the CI scanner fails.
#
# Scope here is kept in sync with sonar-project.properties only as a safety net
# if Automatic Analysis is re-enabled by mistake.

sonar.organization=turbopanel

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Keep in step with sonar-project.properties (co-located tests).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  .expo/**,\
  .tamagui/**,\
  coverage/**

sonar.coverage.exclusions=\
  node_modules/**,\
  dist/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.tsx,\
  **/*.d.ts,\
  src/app/**,\
  src/components/**,\
  src/lib/theme.ts,\
  src/lib/tamagui.config.ts,\
  src/lib/glass.ts,\
  src/lib/os-logos.ts,\
  src/lib/compose/index.ts,\
  src/lib/compose/types.ts,\
  src/lib/queries/index.ts
