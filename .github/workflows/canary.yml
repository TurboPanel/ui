# Canary: after every green Verify from a push to trunk, export the web app
# from that exact commit and publish it to the rolling `canary` pre-release
# (Road to 0.1.x, `trunk-canary`). The export itself is release.yml's — called
# here with channel=canary — so a canary package is the same shape as a release
# package, only versioned <X.Y.Z>-canary.<N> (the version comes from git tags)
# and replaced on the next merge instead of pinned to a tag.
#
# workflow_run (not push) so the export never starts before lint, typecheck
# and tests have passed on the commit. Only a Verify that tested the trunk
# commit itself counts: a PUSH to trunk, or a manual run of trunk (turbopaneld's
# "Start Next Version" re-runs trunk so a started minor gets its canary). The
# trunk → staging Release Candidate PR's Verify also reports head_branch trunk,
# but it tests trunk merged into staging, not the trunk commit, and must never
# stand in for a failed or cancelled trunk run.
# One canary at a time, in merge order, and none dropped: a burst of merges
# queues (`queue: max`, up to 100 pending) instead of cancelling, so every
# green trunk push gets its canary and the rc PR can always find the one for
# the commit it merges. A run started by any other Verify goes to its own
# group, so it never holds up or displaces a real canary.

name: Canary

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ${{ (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && 'canary' || format('canary-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_branch == 'trunk'
    # The ceiling for release.yml: it reads Verify runs (actions) and publishes
    # the canary release (contents).
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      channel: canary
      ref: ${{ github.event.workflow_run.head_sha }}
      verify-run-id: ${{ github.event.workflow_run.id }}
    # The called workflow's signing job declares the `canary` environment. Environment secrets do not
    # reach a job of a reusable workflow in every case, so the repository secret is passed through as a
    # fallback (same key); drop `inherit` once the environment secret is confirmed to resolve.
    secrets: inherit
    # The manifest is signed in the called workflow's job, which declares the
    # `canary` environment and reads its TURBOPANEL_RELEASE_SIGNING_KEY secret.
