name: Verify

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]
  # A manual run of trunk tests the trunk commit itself, like a push: turbopaneld's
  # "Start Next Version" uses it so a started minor gets its canary at once
  # (canary.yml accepts it; a run of any other branch never publishes).
  workflow_dispatch:

# Read-only everywhere: nothing here writes with GITHUB_TOKEN (SonarCloud
# decorates PRs through its own GitHub App).
permissions:
  contents: read

# One run per event and ref at a time. A PR keeps only its newest commit (the
# older run is cancelled). A trunk push never cancels and never drops a run:
# `queue: max` keeps up to 100 pending, so three quick merges each get their
# own Verify and so their own canary. With the default single-pending queue
# the middle merge's run would be replaced, conclude cancelled, and that
# commit would never get a canary.
concurrency:
  group: ui-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  # Lint + typecheck + Vitest LCOV, then, on a pull request, the SonarCloud
  # scan and its quality gate: a failed gate fails this job, so ci-ok is red.
  # On a trunk push the job uploads the LCOV and stops there; sonar-trunk.yml
  # analyses the commit after Verify completes, next to the canary instead of
  # ahead of it. Automatic Analysis must stay off
  # (Administration → Analysis Method).
  verify:
    runs-on: ubuntu-latest
    # Kept as a second guard so two runs of this job for one ref never
    # overlap. The workflow-level block above is what queues runs: it admits
    # one run per event and ref at a time, so on a push this group never holds
    # a second job and never cancels one.
    concurrency:
      group: ui-sonar-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        # Fork PRs and Dependabot PRs cannot receive repository secrets — GitHub
        # withholds them from the dependabot[bot] actor even on same-repo
        # branches — so the require is skipped there and the rest of the chain
        # still gates; the scan below then skips on the empty token. Every other
        # trigger (trunk pushes, same-repo PRs, workflow_call) must have it.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/ui (or org)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Secret scan (every tracked file)
        # The pre-commit hook scans staged files only; CI scans the whole tree.
        run: sh scripts/scan-secrets.sh --all

      - name: Check vocabulary
        run: pnpm check:vocabulary

      - name: Check third-party notices
        run: pnpm notices:check

      # Dependency Advisory Gate (TurboPanel/dev): fails only on a HIGH or
      # CRITICAL advisory that already has a fixed version; everything else is
      # a warning annotation. Override for one verified not exploitable here:
      # an [[IgnoredVulns]] entry with a reason in osv-scanner.toml.
      - name: Dependency advisory gate (osv-scanner)
        uses: TurboPanel/dev/.github/actions/osv-scan@7099adc383f0d0eb7a1d91e907a071e9222dfc2e # dev#46

      # Clean-checkout CI is JS-only (`notices:check --js-only`). Native
      # CocoaPods / Gradle / AAR graphs are required by `pnpm notices:check:native`
      # after Expo prebuild / EAS (`eas-build-post-install --native`).

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        id: sonar
        # Pull requests only; the quality gate blocks pull requests only. A
        # trunk push is analysed by sonar-trunk.yml after Verify completes,
        # from the ui-coverage-lcov artifact uploaded above, so the scan does
        # not hold back the canary (decision 4, 2026-09-30).
        #
        # Also skipped when SONAR_TOKEN is empty (fork or Dependabot PR) and on
        # the automatic promotion PRs into staging/live, which carry only
        # commits already analysed on trunk (no new code to gate).
        if: >-
          env.SONAR_TOKEN != ''
          && github.event_name == 'pull_request'
          && github.base_ref != 'staging'
          && github.base_ref != 'live'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # The Sonar way gate fails only on ratings, so one new code smell passes
      # it; this fails the PR on any new issue (owner rule, 2026-09-30). Runs
      # only where the PR scan above ran, so it skips the promotion PRs too.
      - name: No new Sonar issues
        if: github.event_name == 'pull_request' && steps.sonar.outcome == 'success'
        uses: TurboPanel/dev/.github/actions/sonar-new-issues@2db1bbfa3cff89a52fac3ee4a53bd495dc1c79b1 # dev#47

  # ClickHouse/Tabix metrics infrastructure is retired (DuckDB + Parquet /
  # Analytics Engine replaced it). The guard lives in TurboPanel/turbopaneld
  # (scripts/check-metrics-legacy.ts) and scans sibling checkouts when present,
  # so check this repo out next to it — a clean single-repo turbopaneld CI run
  # cannot see PRs made here. This job covers ui/src and ui/design-system.
  metrics-legacy:
    runs-on: ubuntu-latest
    # Kept as it is; see the note on the verify job's group.
    concurrency:
      group: ui-metrics-legacy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ui

      - name: Check out turbopaneld (metrics-legacy guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          path: turbopaneld

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"

      - name: Check metrics legacy (no ClickHouse/Tabix references)
        working-directory: turbopaneld
        run: deno task check:metrics-legacy

  # The one check the trunk ruleset requires. It waits on every PR-time job
  # and fails unless each one succeeded, so a renamed or added job can never
  # slip past the merge gate; `skipped` is still a failure here because no job
  # above is conditional.
  #
  # On a PR it always reports (`always()`), so a cancelled PR run is red and
  # can never count as green for the merge. On a trunk push nothing merges on
  # it, so a cancelled run (a newer merge superseded it — the run or, through
  # the job-level concurrency above, just its jobs) leaves ci-ok skipped, grey
  # rather than red: a red X on trunk then only ever means a real failure. A
  # failed need with none cancelled still runs it and turns it red (and a
  # failed job is red on the commit either way).
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [verify, metrics-legacy]
    if: >-
      ${{ (github.event_name == 'pull_request' && always())
          || (!cancelled() && !contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
