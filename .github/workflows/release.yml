# Cuts a GitHub Release on a v* tag: the Expo web export, packaged once in
# CI as turbopanel-ui-<version>.tar.gz (the dist/ contents at the tarball
# root — exactly what the daemon's ui-build role untars into
# /opt/turbopanel/share/ui from turbopanel_ui_artifact_url), plus a
# manifest.json with the sha256 and size of that asset. The web export is
# the frontend of both deployments, which is why it is release-blocking in
# a way the store binaries are not (Road to 0.1.x, `artifacts-cp-ui`).
#
# Verify (lint / typecheck / tests / Sonar) is not re-run here: the tag must
# sit on a commit whose Verify already went green — the prepare job checks
# that and refuses otherwise. Dry runs (workflow_dispatch with a throwaway
# version) skip the tag ↔ package.json check but still require a green
# Verify on the commit they build.
#
# The export is a plain `pnpm export`, so the about screen reports the
# non-release source URL (isReleaseBuild() is EAS-only) — the exact commit
# still comes from EXPO_PUBLIC_GIT_COMMIT via app.config.ts.
#
# The canary channel reuses this same export: canary.yml calls this workflow
# (workflow_call, channel=canary) after every green Verify on trunk. The
# version is then package.json's number plus `-canary.<buildId>`, and the
# package goes to the rolling `canary` pre-release through TurboPanel/dev's
# gh-canary.yml instead of a versioned release.

name: Release

on:
  push:
    # v[0-9]* (not v*) so a dry-run dispatch's own tag (e.g. vtest-workflow-0,
    # created by gh release create with no matching pre-existing tag) can't
    # re-trigger this same workflow via the tag-push path.
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without a leading v (e.g. test-workflow-0 for a dry run -- avoid a leading digit so the tag doesn't match v[0-9]* and re-trigger this workflow)
        required: true
        type: string
      channel:
        description: Channel label for this release
        required: true
        type: string
        default: rc
  workflow_call:
    inputs:
      channel:
        description: Only `canary` is meaningful here — the rolling trunk build
        required: true
        type: string
      ref:
        description: The trunk commit to build (the head of the green Verify run)
        required: true
        type: string
    secrets:
      RELEASE_SIGNING_KEY:
        description: PKCS#8 PEM of the offline release key the manifest is signed with
        required: true

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve version, channel and commit
        id: resolve
        run: |
          set -eu
          _commit="$(git rev-parse HEAD)"
          echo "commit=${_commit}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.channel }}" = "canary" ] && [ -n "${{ inputs.ref }}" ]; then
            # The rolling trunk build: package.json's number plus a
            # pre-release suffix carrying the build id, so every asset name
            # is unique per build and semver orders it below the release it
            # leads to.
            _pkg_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
            _build_id="$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short=7 HEAD)"
            echo "version=${_pkg_version}-canary.${_build_id}" >> "$GITHUB_OUTPUT"
            echo "channel=canary" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            _ref="${{ github.ref_name }}"
            echo "version=${_ref#v}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the tag to match package.json's version
        # A tag cut before the bump is a release that lies about itself
        # (app.json and sonar.projectVersion are pinned to package.json by
        # scripts/version-literals.test.ts). Dry runs and canary builds skip
        # this.
        if: inputs.version == '' && steps.resolve.outputs.channel != 'canary'
        run: |
          set -eu
          _tag_version="${{ steps.resolve.outputs.version }}"
          _pkg_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$_tag_version" != "$_pkg_version" ]; then
            echo "::error::tag v${_tag_version} does not match package.json version ${_pkg_version} — bump package.json (and app.json, sonar.projectVersion) first"
            exit 1
          fi

      - name: Require a green Verify on this commit
        # Tag after green, encoded: no lint/typecheck/tests/Sonar re-run here,
        # so the commit must already carry a successful Verify.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          _ok="$(gh run list --repo "${{ github.repository }}" --workflow Verify --commit "${{ steps.resolve.outputs.commit }}" --status success --json databaseId --jq 'length')"
          if [ "${_ok:-0}" -lt 1 ]; then
            echo "::error::no successful Verify run found for ${{ steps.resolve.outputs.commit }} — tag a commit whose Verify is green"
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in step with verify.yml.
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Export the web app
        env:
          CI: "1"
          # app.config.ts resolves the exact commit from this (ahead of
          # GITHUB_SHA, which for a canary build is the trunk head at trigger
          # time, not necessarily the commit being built).
          EXPO_PUBLIC_GIT_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: pnpm export

      - name: Package release assets and write the manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          # Tag-pinned, not releases/latest — a promotion landing between a
          # consumer's manifest fetch and its asset fetch must not 404 it. A
          # canary build points at the rolling release instead: its asset
          # carries the build id in its name, so it is never overwritten.
          ARTIFACT_BASE_URL: ${{ needs.prepare.outputs.channel == 'canary' && format('https://github.com/{0}/releases/download/canary', github.repository) || format('https://github.com/{0}/releases/download/v{1}', github.repository, needs.prepare.outputs.version) }}
        run: |
          set -eu
          test -f dist/index.html
          mkdir -p release-assets
          _name="turbopanel-ui-${VERSION}.tar.gz"
          # dist/ contents at the tarball root: what ui-build untars in place.
          tar -C dist -czf "release-assets/${_name}" .
          python3 - "$_name" <<'PY'
          import hashlib, json, os, re, sys, time
          name = sys.argv[1]
          path = os.path.join("release-assets", name)
          with open(path, "rb") as f:
              data = f.read()
          commit = os.environ["COMMIT"]
          version = os.environ["VERSION"]
          built_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          # A canary version already carries its build id; reuse it so the
          # manifest, the asset name and the release notes all agree.
          m = re.search(r"-canary\.(\d{8}-\d{6}-[0-9a-f]{7})$", version)
          build_id = m.group(1) if m else f"{time.strftime('%Y%m%d-%H%M%S', time.gmtime())}-{commit[:7]}"
          manifest = {
              "schema": 1,
              "channel": os.environ["CHANNEL"],
              "version": version,
              "commit": commit,
              "buildId": build_id,
              "builtAt": built_at,
              "artifacts": {
                  "ui": {
                      "url": f"{os.environ['ARTIFACT_BASE_URL']}/{name}",
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data),
                  }
              },
          }
          with open("release-assets/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      # Sign the finished manifest with the offline release key, using the
      # daemon repo's signer (src/update/signing.ts) so every package has one
      # canonicaliser — the bytes run.sh and the daemon verify. The script
      # refuses a missing key and a key that does not match the public key
      # pinned in that checkout: never publish an unsigned manifest.
      - name: Check out the manifest signer (turbopaneld)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          # turbopaneld trunk carrying scripts/sign-manifest.ts and the current
          # release public key pin. Bump it when the key is rotated.
          ref: ff50f41be40a0ac8101fe3469ad6482d9d9f64a5
          path: .manifest-signer
          fetch-depth: 1
          persist-credentials: false

      - name: Read the signer's Deno pin
        id: signer-pins
        # The daemon role default the signer commit itself is tested against.
        run: |
          set -eu
          v=$(sed -n 's/^deno_version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*$/\1/p' .manifest-signer/orchestration/roles/deno-runtime/defaults/main.yml)
          test -n "$v"
          echo "deno-version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.signer-pins.outputs.deno-version }}

      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          deno run --config .manifest-signer/deno.json \
            --allow-read --allow-write=release-assets/manifest.json \
            --allow-env=RELEASE_SIGNING_KEY \
            .manifest-signer/scripts/sign-manifest.ts release-assets/manifest.json
          python3 -c 'import json; s = json.load(open("release-assets/manifest.json"))["signature"]; print("manifest signed:", s["alg"], "keyId", s["keyId"])'

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbopanel-ui-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.channel != 'canary'
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@177d481666cce2e1dcfa76290b141b0149a6a0a9 # dev trunk 2026-09-25
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      assets-artifact-name: turbopanel-ui-release-assets
      manifest-filename: manifest.json
      release-notes: "See https://github.com/${{ github.repository }}/commits/v${{ needs.prepare.outputs.version }} for changes."

  canary:
    needs: [prepare, build]
    if: needs.prepare.outputs.channel == 'canary'
    uses: TurboPanel/dev/.github/workflows/gh-canary.yml@177d481666cce2e1dcfa76290b141b0149a6a0a9 # dev trunk 2026-09-25
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      assets-artifact-name: turbopanel-ui-release-assets
      manifest-filename: manifest.json
