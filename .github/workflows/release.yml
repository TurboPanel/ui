# Publishes a GitHub Release on a v* tag: the Expo web export, packaged once in
# CI as turbopanel-ui-<version>.tar.gz (the dist/ contents at the tarball
# root — exactly what the daemon's ui-build role untars into
# /opt/turbopanel/share/ui from turbopanel_ui_artifact_url), plus a
# manifest.json with the sha256 and size of that asset. The web export is
# the frontend of both deployments, which is why it is release-blocking in
# a way the store binaries are not (Road to 0.1.x, `artifacts-cp-ui`).
#
# Verify (lint / typecheck / tests / Sonar) is not re-run here: the tag must
# sit on a commit whose Verify from a push to trunk already went green — the
# prepare job checks that and refuses otherwise (a PR's Verify does not count:
# it tests the PR merged into its base, not the commit itself; a manual run of
# trunk counts like a push). Dry runs (workflow_dispatch with a throwaway
# version) still require that green trunk Verify on the commit they build.
#
# The export is a plain `pnpm export`, so the about screen reports the
# non-release source URL (isReleaseBuild() is EAS-only) — the exact commit
# still comes from EXPO_PUBLIC_GIT_COMMIT via app.config.ts.
#
# The canary channel reuses this same export: canary.yml calls this workflow
# (workflow_call, channel=canary) after every green trunk Verify. The version
# then comes from git tags (TurboPanel/dev's Version From Tags action): the
# base X.Y.Z is the newest release's next patch, or a started / in-flight
# version, plus `-canary.<N>` with N restarting at 1 for each base. The package
# goes to the rolling `canary` pre-release through TurboPanel/dev's
# gh-canary.yml instead of a versioned release.
#
# Whatever the path, the app reports the plain base X.Y.Z: it is stamped into
# this checkout's app.json (expo.version, what the about screen shows) and
# package.json before the export, so their committed number is only what a
# local build reports.

name: Release

on:
  push:
    # v[0-9]* (not v*) so a dry-run dispatch's own tag (e.g. vtest-workflow-0,
    # created by gh release create with no matching pre-existing tag) can't
    # re-trigger this same workflow via the tag-push path.
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without a leading v (e.g. test-workflow-0 for a dry run -- avoid a leading digit so the tag doesn't match v[0-9]* and re-trigger this workflow)
        required: true
        type: string
      channel:
        description: Channel label for this release
        required: true
        type: string
        default: rc
  workflow_call:
    inputs:
      channel:
        description: Only `canary` is meaningful here — the rolling trunk build
        required: true
        type: string
      ref:
        description: The trunk commit to build (the head of the green Verify run)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    # A tag pushed by a `[bot]` actor is the TurboPanel Release App
    # promoting a tested build (promote.yml → TurboPanel/dev gh-promote.yml);
    # that flow publishes the release itself, so this from-source path must
    # not race it. A person pushing a tag still gets the classic from-source release; trunk
    # pushes (canary) are unaffected.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh run list: the green Verify lookup below.
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      base: ${{ steps.resolve.outputs.base }}
      channel: ${{ steps.resolve.outputs.channel }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Work out the canary version from the tags
        id: canary
        if: inputs.channel == 'canary' && inputs.ref != ''
        uses: TurboPanel/dev/.github/actions/version@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
        with:
          mode: canary

      - name: Resolve version, channel and commit
        id: resolve
        env:
          CANARY_VERSION: ${{ steps.canary.outputs.version }}
          CANARY_BASE: ${{ steps.canary.outputs.base }}
        run: |
          set -eu
          _commit="$(git rev-parse HEAD)"
          echo "commit=${_commit}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.channel }}" = "canary" ] && [ -n "${{ inputs.ref }}" ]; then
            # The rolling trunk build: the base from the tags (what the app
            # reports) plus a `-canary.<N>` pre-release suffix, so every asset
            # name is unique per build and semver orders it below the release
            # it leads to.
            case "$CANARY_VERSION" in
              *-canary.*) ;;
              *) echo "::error::no canary version worked out (got '${CANARY_VERSION}')"; exit 1 ;;
            esac
            echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "base=${CANARY_BASE}" >> "$GITHUB_OUTPUT"
            echo "channel=canary" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          else
            # A tag pushed by hand: its number is the version (stamped in the
            # build, not checked against package.json — versions come from tags).
            _ref="${{ github.ref_name }}"
            echo "version=${_ref#v}" >> "$GITHUB_OUTPUT"
            echo "base=${_ref#v}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a green Verify on this commit
        # Tag after green, encoded: no lint/typecheck/tests/Sonar re-run here,
        # so the commit must already carry a successful Verify — one that
        # tested the commit itself (a push to trunk, or a manual run of trunk),
        # never a PR's run of it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          _ok="$(gh run list --repo "${{ github.repository }}" --workflow Verify --commit "${{ steps.resolve.outputs.commit }}" --status success --json event --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | length')"
          if [ "${_ok:-0}" -lt 1 ]; then
            echo "::error::no successful push (or manual) Verify run found for ${{ steps.resolve.outputs.commit }} — tag a trunk commit whose Verify is green"
            exit 1
          fi

  build:
    # Signing key = environment secret TURBOPANEL_RELEASE_SIGNING_KEY, one environment per
    # channel: `canary` (trunk), `rc` (staging), `release` (live, owner approval).
    environment: ${{ inputs.channel == 'canary' && 'canary' || (inputs.channel == 'rc' && 'rc' || 'release') }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in step with verify.yml.
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Stamp the version into app.json and package.json
        # The base X.Y.Z, never the -canary.N label. A dry run's throwaway
        # version (not X.Y.Z) leaves them alone. Transient, this checkout only.
        env:
          BASE_VERSION: ${{ needs.prepare.outputs.base }}
        run: |
          set -eu
          case "$BASE_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "dry run ${BASE_VERSION}: app.json keeps its number"; exit 0 ;;
          esac
          node --input-type=module -e '
          import { readFileSync, writeFileSync } from "node:fs";
          const version = process.env.BASE_VERSION;
          const app = JSON.parse(readFileSync("app.json", "utf8"));
          app.expo.version = version;
          writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          pkg.version = version;
          writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "exporting ${BASE_VERSION}"

      - name: Export the web app
        env:
          CI: "1"
          # app.config.ts resolves the exact commit from this (ahead of
          # GITHUB_SHA, which for a canary build is the trunk head at trigger
          # time, not necessarily the commit being built).
          EXPO_PUBLIC_GIT_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: pnpm export

      - name: Package release assets and write the manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          # Tag-pinned, not releases/latest — a promotion landing between a
          # consumer's manifest fetch and its asset fetch must not 404 it. A
          # canary build points at the rolling release instead: its asset
          # carries the build id in its name, so it is never overwritten.
          ARTIFACT_BASE_URL: ${{ needs.prepare.outputs.channel == 'canary' && format('https://github.com/{0}/releases/download/canary', github.repository) || format('https://github.com/{0}/releases/download/v{1}', github.repository, needs.prepare.outputs.version) }}
        run: |
          set -eu
          test -f dist/index.html
          mkdir -p release-assets
          _name="turbopanel-ui-${VERSION}.tar.gz"
          # dist/ contents at the tarball root: what ui-build untars in place.
          tar -C dist -czf "release-assets/${_name}" .
          python3 - "$_name" <<'PY'
          import hashlib, json, os, re, sys, time
          name = sys.argv[1]
          path = os.path.join("release-assets", name)
          with open(path, "rb") as f:
              data = f.read()
          commit = os.environ["COMMIT"]
          version = os.environ["VERSION"]
          built_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          # A pre-2026-09-28 canary version carries its build id; reuse it so the
          # manifest, the asset name and the release notes all agree. A
          # counter canary (`-canary.<run number>`) has none, so the id is
          # stamped from the clock and the commit.
          m = re.search(r"-canary\.(\d{8}-\d{6}-[0-9a-f]{7})$", version)
          build_id = m.group(1) if m else f"{time.strftime('%Y%m%d-%H%M%S', time.gmtime())}-{commit[:7]}"
          manifest = {
              "schema": 1,
              "channel": os.environ["CHANNEL"],
              "version": version,
              "commit": commit,
              "buildId": build_id,
              "builtAt": built_at,
              "artifacts": {
                  "ui": {
                      "url": f"{os.environ['ARTIFACT_BASE_URL']}/{name}",
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data),
                  }
              },
          }
          with open("release-assets/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      # Sign the finished manifest with the offline release key, using the
      # daemon repo's signer (src/update/signing.ts) so every package has one
      # canonicaliser — the bytes run.sh and the daemon verify. The script
      # refuses a missing key and a key that does not match the public key
      # pinned in that checkout: never publish an unsigned manifest.
      - name: Check out the manifest signer (turbopaneld)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          # turbopaneld trunk carrying scripts/sign-manifest.ts and the current
          # release public key pin. Bump it when the key is rotated.
          ref: 6d13d4652e7993a3cbba72232ae49edbf9037938
          path: .manifest-signer
          fetch-depth: 1
          persist-credentials: false

      - name: Read the signer's Deno pin
        id: signer-pins
        # The daemon role default the signer commit itself is tested against.
        run: |
          set -eu
          v=$(sed -n 's/^deno_version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*$/\1/p' .manifest-signer/orchestration/roles/deno-runtime/defaults/main.yml)
          test -n "$v"
          echo "deno-version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ steps.signer-pins.outputs.deno-version }}

      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.TURBOPANEL_RELEASE_SIGNING_KEY || secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          deno run --config .manifest-signer/deno.json \
            --allow-read --allow-write=release-assets/manifest.json \
            --allow-env=RELEASE_SIGNING_KEY \
            .manifest-signer/scripts/sign-manifest.ts release-assets/manifest.json
          python3 -c 'import json; s = json.load(open("release-assets/manifest.json"))["signature"]; print("manifest signed:", s["alg"], "keyId", s["keyId"])'

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbopanel-ui-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.channel != 'canary'
    # gh-release.yml creates the tag and the release.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@177d481666cce2e1dcfa76290b141b0149a6a0a9 # dev trunk 2026-09-25
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      assets-artifact-name: turbopanel-ui-release-assets
      manifest-filename: manifest.json
      release-notes: "See https://github.com/${{ github.repository }}/commits/v${{ needs.prepare.outputs.version }} for changes."

  canary:
    needs: [prepare, build]
    if: needs.prepare.outputs.channel == 'canary'
    # gh-canary.yml moves the canary tag and uploads to the canary release.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-canary.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      assets-artifact-name: turbopanel-ui-release-assets
      manifest-filename: manifest.json
